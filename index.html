<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8番街タワーバトル</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/decomp.js/0.3.0/decomp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #game-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 800px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px 12px 0 0;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .player-info.active {
            transform: scale(1.1);
        }
        #player1-info {
            color: #ff6b6b;
        }
        #player1-info.active {
            background: rgba(255, 107, 107, 0.2);
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
        }
        #player2-info {
            color: #4ecdc4;
        }
        #player2-info.active {
            background: rgba(78, 205, 196, 0.2);
            box-shadow: 0 0 15px rgba(78, 205, 196, 0.3);
        }
        #timer {
            font-size: 32px;
            font-weight: bold;
            color: #ffd93d;
            min-width: 60px;
            text-align: center;
        }
        #timer.warning {
            color: #ff6b6b;
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #game-canvas {
            border: 2px solid #333;
            border-top: none;
            display: block;
            background: linear-gradient(180deg, #0f0f23 0%, #1a1a3e 50%, #16213e 100%);
        }
        #controls-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 800px;
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 0 0 12px 12px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .ctrl-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.4);
        }
        .ctrl-btn:active {
            transform: scale(0.95);
        }
        #drop-btn {
            background: rgba(255, 217, 61, 0.2);
            border-color: #ffd93d;
            color: #ffd93d;
            font-size: 18px;
            font-weight: bold;
            padding: 8px 30px;
        }
        #drop-btn:hover {
            background: rgba(255, 217, 61, 0.3);
        }
        .key-hint {
            font-size: 11px;
            opacity: 0.5;
            display: block;
        }
        #start-screen, #result-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        #start-screen h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #start-screen p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .start-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            border: none;
            color: #fff;
            padding: 15px 50px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: inherit;
        }
        .start-btn:hover {
            transform: scale(1.05);
        }
        #result-screen h2 {
            font-size: 42px;
            margin-bottom: 20px;
        }
        #result-screen .start-btn {
            margin-top: 20px;
        }
        .hidden {
            display: none !important;
        }
        #char-preview {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="start-screen">
    <h1>8番街タワーバトル</h1>
    <p>仲間を積み上げろ！落としたら負け！</p>
    <div style="margin-bottom: 30px; color: #aaa; font-size: 14px; text-align: center; line-height: 2;">
        <div><b style="color:#ffd93d">操作方法</b></div>
        <div>← → : 移動　　↑ ↓ : 回転</div>
        <div>スペース / クリック : 落とす</div>
    </div>
    <button class="start-btn" onclick="startGame()">ゲームスタート</button>
</div>

<div id="result-screen" class="hidden">
    <h2 id="result-text"></h2>
    <p id="result-sub" style="color:#aaa; font-size: 18px;"></p>
    <button class="start-btn" onclick="startGame()">もう一回</button>
</div>

<div id="game-header">
    <div id="player1-info" class="player-info active">
        <span>P1</span>
        <span id="p1-score">0</span>勝
    </div>
    <div id="timer">10</div>
    <div id="player2-info" class="player-info">
        <span>P2</span>
        <span id="p2-score">0</span>勝
    </div>
</div>
<canvas id="game-canvas" width="800" height="600"></canvas>
<div id="controls-bar">
    <button class="ctrl-btn" onclick="rotateLeft()">↶ 回転<span class="key-hint">↑キー</span></button>
    <button class="ctrl-btn" onclick="moveLeft()">← 左<span class="key-hint">←キー</span></button>
    <button class="ctrl-btn" id="drop-btn" onclick="dropPiece()">落とす！<span class="key-hint">スペース</span></button>
    <button class="ctrl-btn" onclick="moveRight()">右 →<span class="key-hint">→キー</span></button>
    <button class="ctrl-btn" onclick="rotateRight()">回転 ↷<span class="key-hint">↓キー</span></button>
</div>

<script>
// ============================================================
// 8番街タワーバトル - Matter.js Physics Tower Battle Game
// ============================================================

const { Engine, Render, Runner, Bodies, Body, Composite, Events, Vector, Vertices, Common } = Matter;

// Set up decomp for concave polygon support
if (typeof decomp !== 'undefined') {
    Common.setDecomp(decomp);
}

// Game constants
const CANVAS_W = 800;
const CANVAS_H = 600;
const PLATFORM_Y = 540;
const PLATFORM_W = 350;
const PLATFORM_H = 20;
const DROP_Y = 60;
const FALL_THRESHOLD = 620;
const TURN_TIME = 10;
const RESTITUTION = 0.05;  // Low bounce
const FRICTION = 0.8;
const MOVE_STEP = 20;
const ROTATION_STEP = Math.PI / 4; // 45 degrees

// Game state
let engine, render, runner;
let currentPlayer = 1;
let currentPiece = null;
let currentPieceType = -1;
let gameActive = false;
let turnTimer = TURN_TIME;
let timerInterval = null;
let p1Score = 0;
let p2Score = 0;
let dropCount = 0;
let waitingForSettle = false;
let settleTimeout = null;
let allDroppedBodies = [];
let lastDroppedByPlayer = {};
let piecesOnPlatform = [];

// Character definitions - 5 unique characters based on the photos
const CHARACTERS = [
    {
        name: "ブレイカー",
        color: "#ff6b6b",
        // Breakdancer pose - L-shaped body
        scale: 1.0,
        vertices: [
            // torso leaning back
            { x: -20, y: -10 },
            { x: 20, y: -10 },
            { x: 25, y: 20 },
            { x: 30, y: 50 },
            // leg up
            { x: 15, y: 55 },
            { x: 5, y: 30 },
            { x: -15, y: 25 },
            { x: -30, y: 10 },
            { x: -35, y: -5 },
        ],
        draw: function(ctx, body) {
            drawCharacterBody(ctx, body, this);
            // Draw details
            const pos = body.position;
            const angle = body.angle;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(angle);
            // Cap
            ctx.fillStyle = "#222";
            ctx.fillRect(-18, -15, 20, 6);
            // SAY text on shirt
            ctx.fillStyle = "#fff";
            ctx.font = "bold 10px sans-serif";
            ctx.fillText("SAY", -8, 8);
            // Shoe
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.ellipse(20, 52, 8, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    },
    {
        name: "スナック配り",
        color: "#4ecdc4",
        // Standing with box - wider body
        scale: 1.0,
        vertices: [
            // head
            { x: -8, y: -40 },
            { x: 8, y: -40 },
            // shoulders
            { x: 18, y: -20 },
            // box extends right
            { x: 30, y: -5 },
            { x: 30, y: 15 },
            // legs
            { x: 15, y: 45 },
            { x: 8, y: 45 },
            { x: 5, y: 20 },
            { x: -5, y: 20 },
            { x: -8, y: 45 },
            { x: -15, y: 45 },
            // left side
            { x: -18, y: -20 },
        ],
        draw: function(ctx, body) {
            drawCharacterBody(ctx, body, this);
            const pos = body.position;
            const angle = body.angle;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(angle);
            // Glasses
            ctx.strokeStyle = "#ffd93d";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(-5, -33, 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(5, -33, 4, 0, Math.PI * 2);
            ctx.stroke();
            // Box
            ctx.fillStyle = "#c4a053";
            ctx.fillRect(15, -5, 15, 18);
            ctx.strokeStyle = "#8B6914";
            ctx.lineWidth = 1;
            ctx.strokeRect(15, -5, 15, 18);
            // Snack inside box
            ctx.fillStyle = "#ff6b35";
            ctx.fillRect(18, 0, 8, 5);
            ctx.restore();
        }
    },
    {
        name: "ゼンタイマン",
        color: "#95a5a6",
        // Standing figure in zentai - narrow and tall
        scale: 1.0,
        vertices: [
            // hood/head
            { x: -7, y: -45 },
            { x: 7, y: -45 },
            // shoulders
            { x: 16, y: -25 },
            // right side body
            { x: 14, y: -10 },
            { x: 16, y: 0 },
            // hips with apron
            { x: 13, y: 10 },
            // legs
            { x: 12, y: 45 },
            { x: 5, y: 45 },
            { x: 2, y: 15 },
            { x: -2, y: 15 },
            { x: -5, y: 45 },
            { x: -12, y: 45 },
            // left side
            { x: -13, y: 10 },
            { x: -16, y: 0 },
            { x: -14, y: -10 },
            { x: -16, y: -25 },
        ],
        draw: function(ctx, body) {
            drawCharacterBody(ctx, body, this);
            const pos = body.position;
            const angle = body.angle;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(angle);
            // Striped apron
            for (let i = 0; i < 5; i++) {
                ctx.fillStyle = i % 2 === 0 ? "#f1c40f" : "#222";
                ctx.fillRect(-12 + i * 5, -5, 5, 18);
            }
            // Belt
            ctx.fillStyle = "#111";
            ctx.fillRect(-13, -6, 26, 3);
            ctx.restore();
        }
    },
    {
        name: "ビッグフェイス",
        color: "#e17055",
        // Large face - big round/oval shape
        scale: 1.0,
        vertices: (function() {
            const verts = [];
            const segments = 10;
            for (let i = 0; i < segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                verts.push({
                    x: Math.cos(angle) * 38,
                    y: Math.sin(angle) * 42
                });
            }
            return verts;
        })(),
        draw: function(ctx, body) {
            drawCharacterBody(ctx, body, this);
            const pos = body.position;
            const angle = body.angle;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(angle);
            // Hair
            ctx.fillStyle = "#2d3436";
            ctx.beginPath();
            ctx.ellipse(0, -30, 35, 15, 0, Math.PI, 0);
            ctx.fill();
            // Eyes
            ctx.fillStyle = "#2d3436";
            ctx.beginPath();
            ctx.ellipse(-12, -8, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(12, -8, 4, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            // Big grin
            ctx.strokeStyle = "#2d3436";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 8, 18, 0.1, Math.PI - 0.1);
            ctx.stroke();
            // Teeth
            ctx.fillStyle = "#fff";
            ctx.fillRect(-6, 10, 12, 7);
            ctx.strokeStyle = "#2d3436";
            ctx.lineWidth = 1;
            ctx.strokeRect(-6, 10, 12, 7);
            ctx.beginPath();
            ctx.moveTo(0, 10);
            ctx.lineTo(0, 17);
            ctx.stroke();
            ctx.restore();
        }
    },
    {
        name: "クールビューティー",
        color: "#a29bfe",
        // Head and shoulders - wider top, narrow bottom
        scale: 1.0,
        vertices: [
            // top of head
            { x: -15, y: -35 },
            { x: 0, y: -38 },
            { x: 15, y: -35 },
            // side of head with hair
            { x: 20, y: -20 },
            { x: 18, y: -5 },
            // shoulders wide
            { x: 30, y: 5 },
            { x: 32, y: 15 },
            { x: 25, y: 30 },
            // bottom
            { x: 10, y: 35 },
            { x: -10, y: 35 },
            // left side
            { x: -25, y: 30 },
            { x: -32, y: 15 },
            { x: -30, y: 5 },
            { x: -18, y: -5 },
            { x: -20, y: -20 },
        ],
        draw: function(ctx, body) {
            drawCharacterBody(ctx, body, this);
            const pos = body.position;
            const angle = body.angle;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(angle);
            // Long hair
            ctx.fillStyle = "#2d3436";
            ctx.beginPath();
            ctx.moveTo(-15, -35);
            ctx.quadraticCurveTo(-22, -20, -20, 0);
            ctx.lineTo(-14, 0);
            ctx.quadraticCurveTo(-16, -18, -10, -30);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(15, -35);
            ctx.quadraticCurveTo(22, -20, 20, 0);
            ctx.lineTo(14, 0);
            ctx.quadraticCurveTo(16, -18, 10, -30);
            ctx.closePath();
            ctx.fill();
            // Face
            ctx.fillStyle = "#2d3436";
            // Eyes - serious look
            ctx.beginPath();
            ctx.ellipse(-7, -18, 3, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(7, -18, 3, 2.5, 0, 0, Math.PI * 2);
            ctx.fill();
            // Mouth - straight/serious
            ctx.strokeStyle = "#2d3436";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-5, -8);
            ctx.lineTo(5, -8);
            ctx.stroke();
            ctx.restore();
        }
    }
];

// Helper function to draw character body shape (handles compound bodies)
function drawCharacterBody(ctx, body, character) {
    const parts = body.parts;

    ctx.fillStyle = character.color;
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 1.5;

    // For compound bodies, parts[0] is the parent, parts[1+] are the actual shapes
    const startIdx = parts.length > 1 ? 1 : 0;
    for (let p = startIdx; p < parts.length; p++) {
        const vertices = parts[p].vertices;
        ctx.beginPath();
        ctx.moveTo(vertices[0].x, vertices[0].y);
        for (let i = 1; i < vertices.length; i++) {
            ctx.lineTo(vertices[i].x, vertices[i].y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }
}

// ============================================================
// Game initialization
// ============================================================
function initGame() {
    if (engine) {
        Composite.clear(engine.world, false);
        Engine.clear(engine);
    }
    if (render) {
        Render.stop(render);
        render.textures = {};
    }
    if (runner) {
        Runner.stop(runner);
    }

    engine = Engine.create({
        gravity: { x: 0, y: 1.5 }
    });

    const canvas = document.getElementById('game-canvas');
    render = Render.create({
        canvas: canvas,
        engine: engine,
        options: {
            width: CANVAS_W,
            height: CANVAS_H,
            wireframes: false,
            background: 'transparent',
            pixelRatio: 1
        }
    });

    // Create platform
    const platform = Bodies.rectangle(CANVAS_W / 2, PLATFORM_Y, PLATFORM_W, PLATFORM_H, {
        isStatic: true,
        restitution: RESTITUTION,
        friction: FRICTION,
        render: { fillStyle: '#34495e', strokeStyle: '#2c3e50', lineWidth: 2 },
        label: 'platform'
    });

    // Create walls (invisible, to keep things from going sideways forever)
    const wallL = Bodies.rectangle(-10, CANVAS_H / 2, 20, CANVAS_H * 2, {
        isStatic: true, render: { visible: false }, label: 'wall'
    });
    const wallR = Bodies.rectangle(CANVAS_W + 10, CANVAS_H / 2, 20, CANVAS_H * 2, {
        isStatic: true, render: { visible: false }, label: 'wall'
    });

    Composite.add(engine.world, [platform, wallL, wallR]);

    runner = Runner.create();
    Runner.run(runner, engine);
    Render.run(render);

    // Custom rendering on top of Matter.js
    Events.on(render, 'afterRender', customDraw);

    // Check for fallen pieces
    Events.on(engine, 'afterUpdate', checkFallen);

    allDroppedBodies = [];
    lastDroppedByPlayer = {};
    piecesOnPlatform = [];
    dropCount = 0;
    waitingForSettle = false;
}

// ============================================================
// Custom draw - render characters on top of physics shapes
// ============================================================
function customDraw() {
    const ctx = render.context;

    // Draw background gradient with stars
    drawBackground(ctx);

    // Draw platform with style
    drawPlatform(ctx);

    // Draw all dropped bodies with character art
    for (const item of piecesOnPlatform) {
        const charDef = CHARACTERS[item.type];
        if (charDef && charDef.draw) {
            charDef.draw(ctx, item.body);
            // Player color indicator ring
            const pColor = item.player === 1 ? 'rgba(255,107,107,0.5)' : 'rgba(78,205,196,0.5)';
            ctx.strokeStyle = pColor;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(item.body.position.x, item.body.position.y, 5, 0, Math.PI * 2);
            ctx.stroke();
        }
    }

    // Draw current floating piece
    if (currentPiece && !waitingForSettle) {
        const charDef = CHARACTERS[currentPieceType];
        if (charDef && charDef.draw) {
            ctx.globalAlpha = 0.85;
            charDef.draw(ctx, currentPiece);
            ctx.globalAlpha = 1.0;
        }

        // Drop guide line
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = currentPlayer === 1 ? 'rgba(255,107,107,0.4)' : 'rgba(78,205,196,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(currentPiece.position.x, currentPiece.position.y + 20);
        ctx.lineTo(currentPiece.position.x, PLATFORM_Y - 10);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // Waiting indicator during settle
    if (waitingForSettle) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(CANVAS_W / 2 - 60, 25, 120, 30);
        ctx.fillStyle = '#ffd93d';
        ctx.font = 'bold 16px "Hiragino Sans", "Meiryo", sans-serif';
        ctx.textAlign = 'center';
        const dots = '.'.repeat(Math.floor(Date.now() / 500) % 4);
        ctx.fillText('判定中' + dots, CANVAS_W / 2, 45);
        ctx.textAlign = 'start';
    }

    // Character name display
    if (currentPiece && !waitingForSettle) {
        const charDef = CHARACTERS[currentPieceType];
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(currentPiece.position.x - 40, currentPiece.position.y - 65, 80, 20);
        ctx.fillStyle = charDef.color;
        ctx.font = 'bold 12px "Hiragino Sans", "Meiryo", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(charDef.name, currentPiece.position.x, currentPiece.position.y - 50);
        ctx.textAlign = 'start';
    }
}

function drawBackground(ctx) {
    // Stars
    if (!drawBackground.stars) {
        drawBackground.stars = [];
        for (let i = 0; i < 50; i++) {
            drawBackground.stars.push({
                x: Math.random() * CANVAS_W,
                y: Math.random() * (PLATFORM_Y - 50),
                r: Math.random() * 1.5 + 0.5,
                a: Math.random() * 0.5 + 0.2
            });
        }
    }
    for (const s of drawBackground.stars) {
        ctx.fillStyle = `rgba(255,255,255,${s.a})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    }

    // Ground below platform
    ctx.fillStyle = '#0d1117';
    ctx.fillRect(0, PLATFORM_Y + PLATFORM_H / 2, CANVAS_W, CANVAS_H);
}

function drawPlatform(ctx) {
    const px = CANVAS_W / 2 - PLATFORM_W / 2;
    const py = PLATFORM_Y - PLATFORM_H / 2;

    // Platform shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(px + 5, py + 5, PLATFORM_W, PLATFORM_H);

    // Platform body
    const grad = ctx.createLinearGradient(px, py, px, py + PLATFORM_H);
    grad.addColorStop(0, '#4a6274');
    grad.addColorStop(1, '#2c3e50');
    ctx.fillStyle = grad;
    ctx.fillRect(px, py, PLATFORM_W, PLATFORM_H);

    // Platform highlight
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fillRect(px, py, PLATFORM_W, 3);

    // Platform supports
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(px + 20, py + PLATFORM_H, 15, 30);
    ctx.fillRect(px + PLATFORM_W - 35, py + PLATFORM_H, 15, 30);
}

// ============================================================
// Piece creation
// ============================================================
function createPiece(typeIndex) {
    const charDef = CHARACTERS[typeIndex];
    const verts = charDef.vertices.map(v => ({ x: v.x * charDef.scale, y: v.y * charDef.scale }));

    // Ensure vertices are in correct order (convex hull)
    const centroid = Vertices.centre(verts);
    const body = Bodies.fromVertices(CANVAS_W / 2, DROP_Y, verts, {
        restitution: RESTITUTION,
        friction: FRICTION,
        frictionAir: 0.01,
        density: 0.002,
        isStatic: true,
        render: { visible: false },
        label: 'piece_' + typeIndex
    }, true);

    if (!body) {
        // Fallback to rectangle if vertices fail
        return Bodies.rectangle(CANVAS_W / 2, DROP_Y, 50, 60, {
            restitution: RESTITUTION,
            friction: FRICTION,
            frictionAir: 0.01,
            density: 0.002,
            isStatic: true,
            render: { visible: false },
            label: 'piece_' + typeIndex
        });
    }

    // Reset position to drop zone
    Body.setPosition(body, { x: CANVAS_W / 2, y: DROP_Y });

    return body;
}

function spawnNextPiece() {
    const typeIndex = Math.floor(Math.random() * CHARACTERS.length);
    currentPieceType = typeIndex;
    currentPiece = createPiece(typeIndex);
    Composite.add(engine.world, currentPiece);
    waitingForSettle = false;
    startTurnTimer();
}

// ============================================================
// Controls
// ============================================================
function moveLeft() {
    if (!currentPiece || waitingForSettle || !gameActive) return;
    const newX = Math.max(40, currentPiece.position.x - MOVE_STEP);
    Body.setPosition(currentPiece, { x: newX, y: currentPiece.position.y });
}

function moveRight() {
    if (!currentPiece || waitingForSettle || !gameActive) return;
    const newX = Math.min(CANVAS_W - 40, currentPiece.position.x + MOVE_STEP);
    Body.setPosition(currentPiece, { x: newX, y: currentPiece.position.y });
}

function rotateLeft() {
    if (!currentPiece || waitingForSettle || !gameActive) return;
    Body.rotate(currentPiece, -ROTATION_STEP);
}

function rotateRight() {
    if (!currentPiece || waitingForSettle || !gameActive) return;
    Body.rotate(currentPiece, ROTATION_STEP);
}

function dropPiece() {
    if (!currentPiece || waitingForSettle || !gameActive) return;

    stopTurnTimer();

    // Make the piece dynamic (affected by gravity)
    Body.setStatic(currentPiece, false);
    Body.setVelocity(currentPiece, { x: 0, y: 0 });

    const droppedBody = currentPiece;
    const droppedType = currentPieceType;
    const droppedByPlayer = currentPlayer;

    piecesOnPlatform.push({ body: droppedBody, type: droppedType, player: droppedByPlayer });
    lastDroppedByPlayer[droppedBody.id] = droppedByPlayer;
    allDroppedBodies.push(droppedBody);
    dropCount++;

    currentPiece = null;
    waitingForSettle = true;

    // Wait for physics to settle, then move to next turn
    let settleChecks = 0;
    const maxSettleTime = 4000; // max 4 seconds
    const checkInterval = 200;
    const maxChecks = maxSettleTime / checkInterval;

    function checkSettle() {
        if (!gameActive) return;
        settleChecks++;

        // Check if all bodies have low velocity (settled)
        let allSettled = true;
        for (const item of piecesOnPlatform) {
            const v = item.body.velocity;
            const speed = Math.sqrt(v.x * v.x + v.y * v.y);
            if (speed > 0.3) {
                allSettled = false;
                break;
            }
        }

        if (allSettled || settleChecks >= maxChecks) {
            if (!gameActive) return;
            waitingForSettle = false;
            switchPlayer();
            spawnNextPiece();
        } else {
            settleTimeout = setTimeout(checkSettle, checkInterval);
        }
    }

    settleTimeout = setTimeout(checkSettle, 800); // initial delay before checking
}

// ============================================================
// Fall detection
// ============================================================
function checkFallen() {
    if (!gameActive) return;

    for (let i = piecesOnPlatform.length - 1; i >= 0; i--) {
        const item = piecesOnPlatform[i];
        const body = item.body;

        if (body.position.y > FALL_THRESHOLD) {
            // A piece fell! The player who dropped it loses
            const losingPlayer = item.player;
            gameOver(losingPlayer);
            return;
        }
    }
}

// ============================================================
// Turn management
// ============================================================
function switchPlayer() {
    currentPlayer = currentPlayer === 1 ? 2 : 1;
    updatePlayerUI();
}

function updatePlayerUI() {
    const p1 = document.getElementById('player1-info');
    const p2 = document.getElementById('player2-info');
    if (currentPlayer === 1) {
        p1.classList.add('active');
        p2.classList.remove('active');
    } else {
        p1.classList.remove('active');
        p2.classList.add('active');
    }
}

function startTurnTimer() {
    turnTimer = TURN_TIME;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        turnTimer--;
        updateTimerDisplay();
        if (turnTimer <= 0) {
            // Auto-drop
            dropPiece();
        }
    }, 1000);
}

function stopTurnTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
}

function updateTimerDisplay() {
    const timerEl = document.getElementById('timer');
    timerEl.textContent = turnTimer;
    if (turnTimer <= 3) {
        timerEl.classList.add('warning');
    } else {
        timerEl.classList.remove('warning');
    }
}

// ============================================================
// Game flow
// ============================================================
function startGame() {
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.add('hidden');

    initGame();
    gameActive = true;
    currentPlayer = 1;
    updatePlayerUI();
    spawnNextPiece();
}

function gameOver(losingPlayer) {
    gameActive = false;
    stopTurnTimer();
    if (settleTimeout) clearTimeout(settleTimeout);
    waitingForSettle = false;

    const winningPlayer = losingPlayer === 1 ? 2 : 1;

    if (winningPlayer === 1) {
        p1Score++;
    } else {
        p2Score++;
    }
    document.getElementById('p1-score').textContent = p1Score;
    document.getElementById('p2-score').textContent = p2Score;

    const resultScreen = document.getElementById('result-screen');
    const resultText = document.getElementById('result-text');
    const resultSub = document.getElementById('result-sub');

    const winColor = winningPlayer === 1 ? '#ff6b6b' : '#4ecdc4';
    resultText.innerHTML = `<span style="color:${winColor}">プレイヤー${winningPlayer}</span> の勝ち！`;
    resultSub.textContent = `${dropCount}体を積み上げた！`;

    setTimeout(() => {
        resultScreen.classList.remove('hidden');
    }, 1000);
}

// ============================================================
// Keyboard input
// ============================================================
document.addEventListener('keydown', (e) => {
    if (!gameActive) return;
    switch (e.key) {
        case 'ArrowLeft':
            e.preventDefault();
            moveLeft();
            break;
        case 'ArrowRight':
            e.preventDefault();
            moveRight();
            break;
        case 'ArrowUp':
            e.preventDefault();
            rotateLeft();
            break;
        case 'ArrowDown':
            e.preventDefault();
            rotateRight();
            break;
        case ' ':
            e.preventDefault();
            dropPiece();
            break;
    }
});

// Mouse/touch controls on canvas
const canvas = document.getElementById('game-canvas');
canvas.addEventListener('click', (e) => {
    if (!gameActive || !currentPiece || waitingForSettle) return;

    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;

    // If clicking below the piece, drop it
    if (e.clientY - rect.top > 100) {
        dropPiece();
    } else {
        // Move piece to click position
        const newX = Math.max(40, Math.min(CANVAS_W - 40, x));
        Body.setPosition(currentPiece, { x: newX, y: currentPiece.position.y });
    }
});

// Touch/drag support
let isDragging = false;
canvas.addEventListener('touchstart', (e) => {
    if (!gameActive || !currentPiece || waitingForSettle) return;
    isDragging = true;
    e.preventDefault();
});

canvas.addEventListener('touchmove', (e) => {
    if (!isDragging || !currentPiece || waitingForSettle) return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const touch = e.touches[0];
    const x = touch.clientX - rect.left;
    const newX = Math.max(40, Math.min(CANVAS_W - 40, x));
    Body.setPosition(currentPiece, { x: newX, y: currentPiece.position.y });
});

canvas.addEventListener('touchend', (e) => {
    if (isDragging && currentPiece && !waitingForSettle && gameActive) {
        dropPiece();
    }
    isDragging = false;
});

</script>
</body>
